version: '3.8'

services:
  fastuav-mpi:
    build: .
    container_name: fastuav_mpi_container
    ports:
      - "8888:8888"
    volumes:
      # 로컬 디렉토리를 도커 컨테이너의 /workspace 와 동기화
      - .:/workspace
    environment:
      - JUPYTER_TOKEN=fastuav
    # CPU 전체 코어 활용을 위한 옵션 (필요시 조절)
    deploy:
      resources:
        reservations:
          cpus: '0.0' # 0.0 은 제한 없음, 가용한 모든 코어 사용
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='fastuav'
